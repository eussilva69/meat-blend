<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <script>document.documentElement.classList.add('js')</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#232629">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="https://www.meatblend.com.br/{{canonical}}">
  <link rel="icon" href="{{base}}favicon.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
  <link rel="icon" href="{{base}}favicon-escuro.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="{{base}}apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Meat Blend">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="https://www.meatblend.com.br/{{canonical}}">
  <meta property="og:image" content="https://www.meatblend.com.br/assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logotipo meat blend e a frase “O blend que vira assinatura da sua casa” ao lado de um hambúrguer duplo">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="{{base}}assets/fonts/exo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{base}}assets/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{base}}assets/css/style.css?v={{v}}">
  <script src="{{base}}assets/js/main.js?v={{v}}" defer></script>
{{jsonld}}
</head>
