<div class="form__status" role="status" tabindex="-1" data-status></div>
          <template data-status-tpl="opened">
            <svg class="icon" aria-hidden="true"><use href="#i-wa"/></svg>
            <div>
              <p><strong>Falta só um passo:</strong> confira a mensagem no WhatsApp e toque em Enviar. O pedido só chega para a gente depois disso.</p>
              <p class="form__status-links"><a data-wa-link href="#" target="_blank" rel="noopener">O WhatsApp não abriu? Abrir de novo</a> · <a data-mail-link href="#">Prefiro enviar por e-mail</a></p>
            </div>
          </template>
          <template data-status-tpl="blocked">
            <svg class="icon" aria-hidden="true"><use href="#i-wa"/></svg>
            <div>
              <p><strong>Falta só um passo:</strong> o navegador não abriu o WhatsApp sozinho. Toque no botão abaixo para abrir a sua mensagem pronta e depois toque em Enviar.</p>
              <p><a class="btn btn--red" data-wa-link href="#" target="_blank" rel="noopener"><svg class="icon" aria-hidden="true"><use href="#i-wa"/></svg>Abrir o WhatsApp com a mensagem</a></p>
              <p class="form__status-links"><a data-mail-link href="#">Prefiro enviar por e-mail</a></p>
            </div>
          </template>
